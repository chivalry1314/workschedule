name: Deploy to CloudBase

on:
  push:
    branches: [main]
    paths:
      - 'workschedule-api/**'
      - 'workschedule-web/**'
      - '.github/workflows/deploy-cloudbase.yml'
  workflow_dispatch:

jobs:
  deploy-api:
    name: 部署后端云函数
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            workschedule-api/package-lock.json

      - name: 安装 CloudBase CLI 与部署插件
        run: |
          npm install -g @cloudbase/cli @cloudbase/framework-core@1.9.7 @cloudbase/framework-plugin-function@1.9.7 @cloudbase/framework-plugin-website@1.9.7

      - name: 登录 CloudBase
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: |
          printf '%s' "$TENCENTCLOUD_SECRETID" > /tmp/secret_id
          printf '%s' "$TENCENTCLOUD_SECRETKEY" > /tmp/secret_key
          cloudbase login --apiKeyId "$(cat /tmp/secret_id)" --apiKey "$(cat /tmp/secret_key)"

      - name: 构建并部署后端
        working-directory: workschedule-api
        env:
          CLOUDBASE_ENV_ID: ${{ secrets.CLOUDBASE_ENV_ID }}
          CLOUDBASE_APIKEY: ${{ secrets.CLOUDBASE_APIKEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
        run: |
          npm ci
          npm run build
          cloudbase framework:deploy -e "$CLOUDBASE_ENV_ID" --yes

  deploy-web:
    name: 部署前端静态网站
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查 API_BASE_URL
        id: check_api_url
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::warning::API_BASE_URL 未配置，跳过前端部署。请在 GitHub Secrets 中设置 API_BASE_URL 后重新触发 workflow。"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
            echo "API_BASE_URL 已配置: $API_BASE_URL"
          fi

      - name: 设置 Node.js
        if: steps.check_api_url.outputs.missing == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            workschedule-web/package-lock.json

      - name: 安装 CloudBase CLI 与部署插件
        if: steps.check_api_url.outputs.missing == 'false'
        run: |
          npm install -g @cloudbase/cli @cloudbase/framework-core@1.9.7 @cloudbase/framework-plugin-function@1.9.7 @cloudbase/framework-plugin-website@1.9.7

      - name: 登录 CloudBase
        if: steps.check_api_url.outputs.missing == 'false'
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: |
          printf '%s' "$TENCENTCLOUD_SECRETID" > /tmp/secret_id
          printf '%s' "$TENCENTCLOUD_SECRETKEY" > /tmp/secret_key
          cloudbase login --apiKeyId "$(cat /tmp/secret_id)" --apiKey "$(cat /tmp/secret_key)"

      - name: 构建并部署前端
        if: steps.check_api_url.outputs.missing == 'false'
        working-directory: workschedule-web
        env:
          CLOUDBASE_ENV_ID: ${{ secrets.CLOUDBASE_ENV_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          npm ci
          echo "VITE_API_BASE_URL=$API_BASE_URL" > .env.production
          npm run build
          cloudbase framework:deploy -e "$CLOUDBASE_ENV_ID" --yes

      - name: 提示首次部署后续操作
        if: steps.check_api_url.outputs.missing == 'true'
        run: |
          echo "=========================================="
          echo "后端云函数已部署成功。"
          echo "下一步："
          echo "1. 登录 CloudBase 控制台 → 云函数 → workschedule-api"
          echo "2. 复制函数访问 URL（如 https://xxx.service.tcloudbase.com/api）"
          echo "3. 在 GitHub 仓库 Settings → Secrets → Actions 中添加 API_BASE_URL"
          echo "   格式示例：https://your-domain.com/api/v1"
          echo "4. 重新触发本 workflow 或 push 任意提交以部署前端"
          echo "=========================================="
