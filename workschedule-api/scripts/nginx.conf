# 阿里云 ECS 99 元/年服务器 Nginx 配置示例
# 假设：
#   - 后端 API 运行在 127.0.0.1:3000
#   - 前端静态文件放在 /opt/workschedule/workschedule-web/dist
#   - 你的域名是 your-domain.com（已备案并解析到服务器公网 IP）
#
# 使用方式：
#   1. 把本文件复制到 /etc/nginx/sites-available/workschedule
#   2. 修改 server_name 为你的域名
#   3. 如果有 SSL 证书，取消 ssl 相关注释并配置证书路径
#   4. ln -s /etc/nginx/sites-available/workschedule /etc/nginx/sites-enabled/
#   5. nginx -t && systemctl reload nginx

server {
    listen 80;
    # listen 443 ssl http2;
    server_name your-domain.com;

    # SSL 证书配置（推荐用 certbot / 阿里云 SSL 免费证书申请后开启）
    # ssl_certificate /etc/nginx/ssl/your-domain.com.crt;
    # ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # 日志
    access_log /opt/workschedule/logs/nginx-access.log;
    error_log /opt/workschedule/logs/nginx-error.log;

    # 前端静态文件
    root /opt/workschedule/workschedule-web/dist;
    index index.html;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # SPA 回退：所有非 API、非静态资源请求都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
